<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS IoT Monitoring Dashboard</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accentBlue: '#3b82f6',
                    }
                }
            }
        }
    </script>

    <!-- Leaflet JS & CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 lg:px-8 py-3 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold text-xl shadow-lg shadow-blue-500/10">
                <i class="fas fa-location-crosshairs"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-slate-100 tracking-tight flex items-center gap-2">
                    Monitoring GPS <span class="text-xs font-semibold px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20">IoT Dashboard</span>
                </h1>
                <p class="text-xs text-slate-400 hidden sm:block">Pelacakan Posisi & Pergerakan Real-Time</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <!-- Connection Status Badge -->
           

            <!-- Device ID Badge -->
           
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 lg:p-6 max-w-[1800px] w-full mx-auto">
        
        <!-- Left Column: Leaflet Map Container (lg:col-span-8) -->
        <section class="lg:col-span-8 flex flex-col gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col flex-1 relative shadow-xl min-h-[500px]">
                
                <!-- Map Header Bar -->
                <div class="flex items-center justify-between mb-3 px-2">
                    <div class="flex items-center gap-2 text-sm font-semibold text-slate-200">
                        <i class="fas fa-map-marked-alt text-blue-400"></i> Peta Lokasi Real-Time (Leaflet JS)
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="btnCenterMap" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 border border-slate-700">
                            <i class="fas fa-crosshairs text-blue-400"></i> Fokus Marker
                        </button>
                    </div>
                </div>

                <!-- Leaflet Map Canvas -->
                <div id="map" class="flex-1 w-full rounded-xl overflow-hidden shadow-inner border border-slate-800/80"></div>
            </div>
        </section>

        <!-- Right Column: Control Panel & Live Metrics (lg:col-span-4) -->
        <section class="lg:col-span-4 flex flex-col gap-4">
            
            <!-- Coordinate Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg space-y-3">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <span class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                        <i class="fas fa-location-dot text-rose-400"></i> Koordinat 
                    </span>
                    <button id="btnCopyCoords" class="text-xs text-blue-400 hover:text-blue-300 transition-colors flex items-center gap-1">
                        <i class="fas fa-copy"></i> Salin
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs font-mono">
                    <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-800">
                        <span class="text-slate-500 block text-2xs mb-0.5">LATITUDE</span>
                        <span id="latitudeVal" class="text-slate-100 font-semibold">-6.208800</span>
                    </div>
                    <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-800">
                        <span class="text-slate-500 block text-2xs mb-0.5">LONGITUDE</span>
                        <span id="longitudeVal" class="text-slate-100 font-semibold">106.845600</span>
                    </div>
                </div>
                <div class="text-2xs text-slate-500 flex items-center justify-between pt-1">
                    <span>Terakhir Diperbarui:</span>
                    <span id="lastUpdated" class="font-mono text-slate-400">14:45:00</span>
                </div>
            </div>

            <!-- IP Address Settings -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg space-y-3">
                <h3 class="text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                    <i class="fas fa-network-wired text-amber-400"></i> Pengaturan Koneksi API
                </h3>
                
                <div class="flex flex-col gap-2">
                    <label for="ipAddressInput" class="text-xs text-slate-400">Alamat IP / URL Backend:</label>
                    <div class="flex gap-2">
                        <input type="text" id="ipAddressInput" placeholder="Misal: http://192.168.1.100" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                        <button id="btnSetIp" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-colors">Hubungkan</button>
                    </div>
                    <div id="ipStatusText" class="text-2xs text-emerald-500 mt-1">Menggunakan API lokal default</div>
                </div>
            </div>

        </section>
    </main>

    <!-- Footer -->
   
    <!-- App JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
